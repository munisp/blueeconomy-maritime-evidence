services:
  postgres:
    image: postgres:16
    network_mode: host
    command: ["postgres", "-p", "55432"]
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: ${EVIDENCE_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: evidence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence -p 55432"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - evidence-postgres-data:/var/lib/postgresql/data

volumes:
  evidence-postgres-data: {}
